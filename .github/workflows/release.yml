name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC): no token secret
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Tag must match package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Trusted publishing needs npm >= 11.5.1. Provenance is attached automatically.
      - run: npm install -g npm@latest
      - run: npm publish --access public

  # Opens a PR on the tap with the new url + sha256. It merges itself once the tap's CI has installed the formula.
  # Needs the secret HOMEBREW_TAP_TOKEN: a fine-grained token on ninhache/homebrew-tap
  # with "Contents" and "Pull requests" set to read and write.
  homebrew:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ninhache/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Open the bump PR
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          branch="chore/probe-$version"
          url="https://registry.npmjs.org/@ninhache/probe/-/probe-$version.tgz"
          # A fresh version can take a few minutes to reach the registry CDN.
          curl -fsSL --retry 10 --retry-delay 30 --retry-all-errors -o probe.tgz "$url"
          sha="$(sha256sum probe.tgz | cut -d' ' -f1)"
          rm probe.tgz
          sed -i -e "s|^  url .*|  url \"$url\"|" -e "s|^  sha256 .*|  sha256 \"$sha\"|" Formula/probe.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "chore(probe): bump to $version"
          git push origin "$branch"
          {
            echo "## Situation"
            echo "\`@ninhache/probe@$version\` was published to npm."
            echo "## Task"
            echo "Point the formula at the new tarball."
            echo "## Action"
            echo "Update \`url\` and \`sha256\` in \`Formula/probe.rb\`."
            echo "## Result"
            echo "Merges automatically once CI has installed, tested and audited the formula."
          } > "$RUNNER_TEMP/body.md"
          gh pr create --base main --head "$branch" \
            --title "chore(probe): bump to $version" --body-file "$RUNNER_TEMP/body.md"
          # Needs "Allow auto-merge" and required status checks on the tap's main.
          gh pr merge "$branch" --auto --merge
