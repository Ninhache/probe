name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest ships GNU Make 3.81: the oldest make the generated block must support.
        os: [ubuntu-latest, macos-latest]
        node: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    env:
      PROBE_NO_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Not on the runners: the completion tests of these shells are skipped without them.
      - name: Install zsh and fish
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Whatever Node built it, the CLI must run on the oldest supported one.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Demo through make, on Node 22
        working-directory: examples/demo
        run: |
          node --version
          make --version | head -n 1
          node server.mjs &
          sleep 2
          make help PROBE="node ../../dist/cli.js"
          make check PROBE="node ../../dist/cli.js"
